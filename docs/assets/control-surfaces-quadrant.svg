<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Control surfaces for long-running AI work</title>
  <desc id="desc">A quadrant chart showing model behavior as hardest to change with low practical user control, context as easy to change with useful but non-deterministic control, and harness work as harder than context but high-control.</desc>
  <rect width="1280" height="720" fill="#f7f5f0"/>

  <style>
    .title { font: 700 34px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #30343b; }
    .axis { stroke: #59616b; stroke-width: 2.5; marker-end: url(#arrow); }
    .grid { stroke: #cfd4d8; stroke-width: 1.5; stroke-dasharray: 7 9; }
    .axis-label { font: 600 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3f4650; }
    .tick { font: 600 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #59616b; }
    .quad { font: 500 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9aa0a6; }
    .label { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .note { font: 400 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4f5661; }
    .callout { fill: #ffffff; fill-opacity: .68; stroke: #e0ddd7; stroke-width: 1; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59616b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#30343b" flood-opacity=".12"/>
    </filter>
  </defs>

  <text class="title" x="640" y="82" text-anchor="middle">Control surfaces for long-running AI work</text>

  <line class="grid" x1="640" y1="145" x2="640" y2="600"/>
  <line class="grid" x1="190" y1="372" x2="1090" y2="372"/>
  <line class="axis" x1="190" y1="600" x2="1090" y2="600"/>
  <line class="axis" x1="190" y1="600" x2="190" y2="145"/>

  <text class="axis-label" x="640" y="654" text-anchor="middle">Implementation difficulty</text>
  <text class="axis-label" x="118" y="354" text-anchor="middle">Practical</text>
  <text class="axis-label" x="118" y="382" text-anchor="middle">user control</text>
  <text class="tick" x="190" y="640" text-anchor="middle">Easy</text>
  <text class="tick" x="1090" y="640" text-anchor="middle">Hard</text>
  <text class="tick" x="168" y="158" text-anchor="end">High</text>
  <text class="tick" x="168" y="604" text-anchor="end">Low</text>

  <text class="quad" x="260" y="176">fast leverage</text>
  <text class="quad" x="845" y="176">reliable control</text>
  <text class="quad" x="870" y="565">least accessible</text>

  <g filter="url(#shadow)">
    <rect class="callout" x="286" y="225" width="332" height="116" rx="8"/>
    <circle cx="322" cy="278" r="22" fill="#4f8fb6"/>
    <text class="label" x="360" y="268" fill="#376f92">Context</text>
    <text class="note" x="360" y="300">Easy to adjust; useful</text>
    <text class="note" x="360" y="326">but non-deterministic</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="callout" x="500" y="205" width="308" height="126" rx="8"/>
    <circle cx="638" cy="262" r="22" fill="#6da562"/>
    <text class="label" x="530" y="250" fill="#547d4f">Harness</text>
    <text class="note" x="530" y="284">More setup; deterministic</text>
    <text class="note" x="530" y="310">guardrails</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="callout" x="860" y="448" width="276" height="116" rx="8"/>
    <circle cx="898" cy="501" r="22" fill="#b47a76"/>
    <text class="label" x="936" y="492" fill="#454a52">Model</text>
    <text class="note" x="936" y="524">Little leverage;</text>
    <text class="note" x="936" y="550">hardest to change</text>
  </g>
</svg>
