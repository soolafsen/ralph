<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Leverage versus control for long-running AI work</title>
  <desc id="desc">A chart placing model, context, and harness on leverage and control axes. Model has low leverage and low control, context has high leverage but limited control, and harness has high leverage and high control.</desc>
  <rect width="1280" height="720" fill="#f7f5f0"/>

  <style>
    .title { font: 700 34px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #30343b; }
    .axis { stroke: #59616b; stroke-width: 2.5; marker-end: url(#arrow); }
    .grid { stroke: #cfd4d8; stroke-width: 1.5; stroke-dasharray: 7 9; }
    .axis-label { font: 600 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3f4650; }
    .tick { font: 600 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #59616b; }
    .hint { font: 500 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9aa0a6; }
    .label { font: 700 29px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .note { font: 400 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4f5661; }
    .card { fill: #ffffff; fill-opacity: .7; stroke: #e0ddd7; stroke-width: 1; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59616b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#30343b" flood-opacity=".12"/>
    </filter>
  </defs>

  <text class="title" x="640" y="82" text-anchor="middle">Leverage vs control in long-running AI work</text>

  <line class="grid" x1="640" y1="145" x2="640" y2="600"/>
  <line class="grid" x1="190" y1="372" x2="1090" y2="372"/>
  <line class="axis" x1="190" y1="600" x2="1090" y2="600"/>
  <line class="axis" x1="190" y1="600" x2="190" y2="145"/>

  <text class="axis-label" x="640" y="654" text-anchor="middle">Control</text>
  <text class="axis-label" x="118" y="372" text-anchor="middle">Leverage</text>
  <text class="tick" x="190" y="640" text-anchor="middle">Low</text>
  <text class="tick" x="1090" y="640" text-anchor="middle">High</text>
  <text class="tick" x="168" y="158" text-anchor="end">High</text>
  <text class="tick" x="168" y="604" text-anchor="end">Low</text>

  <text class="hint" x="270" y="176">useful but probabilistic</text>
  <text class="hint" x="830" y="176">reliable control surface</text>
  <text class="hint" x="830" y="565">least direct leverage</text>

  <g filter="url(#shadow)">
    <rect class="card" x="275" y="205" width="360" height="126" rx="8"/>
    <circle cx="313" cy="262" r="22" fill="#4f8fb6"/>
    <text class="label" x="352" y="250" fill="#376f92">Context</text>
    <text class="note" x="352" y="284">High leverage;</text>
    <text class="note" x="352" y="310">non-deterministic control</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="780" y="205" width="315" height="126" rx="8"/>
    <circle cx="818" cy="262" r="22" fill="#6da562"/>
    <text class="label" x="856" y="250" fill="#547d4f">Harness</text>
    <text class="note" x="856" y="284">High leverage;</text>
    <text class="note" x="856" y="310">deterministic control</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="275" y="448" width="315" height="116" rx="8"/>
    <circle cx="313" cy="501" r="22" fill="#b47a76"/>
    <text class="label" x="352" y="492" fill="#454a52">Model</text>
    <text class="note" x="352" y="524">Low direct leverage;</text>
    <text class="note" x="352" y="550">low user control</text>
  </g>
</svg>
