<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-label="Ralph loop diagram showing PRD checkpoint, story selection, fresh agent session, verification, reflection, memory, and the next iteration">
  <defs>
    <marker id="arrow-slate" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L13,7 L1,13 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L13,7 L1,13 Z" fill="#0f766e"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #d7dee8; stroke-width: 1.5; }
      .soft-panel { fill: #f1f5f9; stroke: #d7dee8; stroke-width: 1.2; }
      .title { font: 700 34px "Inter", "Avenir Next", "Helvetica Neue", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px "Inter", "Avenir Next", "Helvetica Neue", Arial, sans-serif; fill: #475569; }
      .node-title { font: 700 18px "Inter", "Avenir Next", "Helvetica Neue", Arial, sans-serif; fill: #0f172a; }
      .node-text { font: 500 13.5px "Inter", "Avenir Next", "Helvetica Neue", Arial, sans-serif; fill: #475569; }
      .small { font: 600 12px "Inter", "Avenir Next", "Helvetica Neue", Arial, sans-serif; fill: #64748b; }
      .label { font: 700 12px "Inter", "Avenir Next", "Helvetica Neue", Arial, sans-serif; fill: #0f766e; }
      .number { font: 800 17px "Inter", "Avenir Next", "Helvetica Neue", Arial, sans-serif; fill: #ffffff; }
      .center-title { font: 800 28px "Inter", "Avenir Next", "Helvetica Neue", Arial, sans-serif; fill: #0f172a; }
      .center-text { font: 500 15px "Inter", "Avenir Next", "Helvetica Neue", Arial, sans-serif; fill: #475569; }
      .loop { fill: none; stroke: #0f766e; stroke-width: 7; stroke-linecap: round; marker-end: url(#arrow-teal); }
      .flow { fill: none; stroke: #334155; stroke-width: 2.5; stroke-linecap: round; marker-end: url(#arrow-slate); }
      .hint { fill: #ecfdf5; stroke: #99f6e4; stroke-width: 1.2; }
      .chip { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.2; }
      .dot-teal { fill: #0f766e; }
      .dot-slate { fill: #334155; }
      .dot-amber { fill: #b45309; }
      .dot-blue { fill: #2563eb; }
      .dot-violet { fill: #7c3aed; }
      .dot-rose { fill: #be123c; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="760" rx="22"/>

  <rect class="panel" x="42" y="34" width="1196" height="692" rx="20"/>

  <text class="title" x="78" y="88">Ralph Build Loop</text>
  <text class="subtitle" x="78" y="115">Each iteration starts fresh, completes one PRD story, records what happened, then feeds compact learning into the next pass.</text>

  <path class="loop" d="M640 160
                        C830 160 988 278 988 420
                        C988 566 832 648 640 648
                        C448 648 292 566 292 420
                        C292 278 450 160 640 160"/>

  <rect class="soft-panel" x="512" y="288" width="256" height="154" rx="16"/>
  <text class="center-title" x="548" y="337">One Iteration</text>
  <text class="center-text" x="548" y="368">Fresh agent session</text>
  <text class="center-text" x="548" y="392">Bounded context</text>
  <text class="center-text" x="548" y="416">Explicit disk state</text>

  <g>
    <rect class="panel" x="222" y="178" width="236" height="114" rx="14"/>
    <circle class="dot-amber" cx="250" cy="208" r="15"/>
    <text class="number" x="245" y="214">1</text>
    <text class="node-title" x="278" y="214">PRD Checkpoint</text>
    <text class="node-text" x="250" y="244">Read .agents/tasks/prd.json</text>
    <text class="node-text" x="250" y="266">Story status drives resume</text>
  </g>

  <g>
    <rect class="panel" x="522" y="134" width="236" height="114" rx="14"/>
    <circle class="dot-blue" cx="550" cy="164" r="15"/>
    <text class="number" x="545" y="170">2</text>
    <text class="node-title" x="578" y="170">Pick Story</text>
    <text class="node-text" x="550" y="200">Select next open story</text>
    <text class="node-text" x="550" y="222">Keep work scoped to it</text>
  </g>

  <g>
    <rect class="panel" x="822" y="178" width="236" height="114" rx="14"/>
    <circle class="dot-violet" cx="850" cy="208" r="15"/>
    <text class="number" x="845" y="214">3</text>
    <text class="node-title" x="878" y="214">Build Session</text>
    <text class="node-text" x="850" y="244">Start a new agent run</text>
    <text class="node-text" x="850" y="266">Inject bounded context</text>
  </g>

  <g>
    <rect class="panel" x="822" y="494" width="236" height="114" rx="14"/>
    <circle class="dot-teal" cx="850" cy="524" r="15"/>
    <text class="number" x="845" y="530">4</text>
    <text class="node-title" x="878" y="530">Verify</text>
    <text class="node-text" x="850" y="560">Run focused checks</text>
    <text class="node-text" x="850" y="582">Mark the story done</text>
  </g>

  <g>
    <rect class="panel" x="522" y="538" width="236" height="114" rx="14"/>
    <circle class="dot-rose" cx="550" cy="568" r="15"/>
    <text class="number" x="545" y="574">5</text>
    <text class="node-title" x="578" y="574">Reflect</text>
    <text class="node-text" x="550" y="604">Write .reflection.json</text>
    <text class="node-text" x="550" y="626">Record status and evidence</text>
  </g>

  <g>
    <rect class="panel" x="222" y="494" width="236" height="114" rx="14"/>
    <circle class="dot-slate" cx="250" cy="524" r="15"/>
    <text class="number" x="245" y="530">6</text>
    <text class="node-title" x="278" y="530">Learn</text>
    <text class="node-text" x="250" y="560">Update recipes and strategy</text>
    <text class="node-text" x="250" y="582">Reuse only trusted signals</text>
  </g>

  <path class="flow" d="M458 220 C488 195 502 190 522 190"/>
  <path class="flow" d="M758 190 C788 190 802 195 822 220"/>
  <path class="flow" d="M940 292 C970 348 970 430 940 494"/>
  <path class="flow" d="M822 568 C790 594 778 598 758 598"/>
  <path class="flow" d="M522 598 C488 598 478 594 458 568"/>
  <path class="flow" d="M340 494 C310 434 310 350 340 292"/>

  <rect class="hint" x="78" y="154" width="128" height="92" rx="12"/>
  <text class="label" x="98" y="182">INPUTS</text>
  <text class="node-text" x="98" y="206">PRD</text>
  <text class="node-text" x="98" y="226">repo files</text>

  <rect class="chip" x="994" y="343" width="178" height="72" rx="12"/>
  <text class="label" x="1014" y="371" fill="#92400e">SESSION BOUNDARY</text>
  <text class="node-text" x="1014" y="395">New session each</text>
  <text class="node-text" x="1014" y="413">iteration</text>

  <rect class="hint" x="78" y="620" width="312" height="72" rx="12"/>
  <text class="label" x="98" y="656">MEMORY IS FILE-BASED</text>
  <text class="node-text" x="98" y="678">.ralph/knowledge feeds the next loop</text>

  <text class="small" x="812" y="648">Logs, summaries, metrics, reflections,</text>
  <text class="small" x="812" y="668">and learned recipes stay inspectable under .ralph/.</text>
</svg>
